name: Vheer Repository Image Generation Engine
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'AI Target Modification Prompt'
        required: true
        default: 'remove the jacket'
        type: string
      image_name:
        description: 'The repo file name (e.g., input-image or input-image.jpg)'
        required: true
        default: 'input-image'
        type: string

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Run Complete Vheer Pipeline
        run: |
          # 1. Clone your repository code tree into the runner workspace
          uses=actions/checkout@v4 
          node_setup=actions/setup-node@v4
          mkdir -p output
          npm init -y
          
          # 2. Check for the committed file matching 'input-image'
          echo "Searching for target image file in repository..."
          TARGET_FILE=$(find . -maxdepth 1 -name "${{ inputs.image_name }}*" -print -quit)
          
          if [ -z "$TARGET_FILE" ]; then
            echo "::error:: Could not find any repository file matching '${{ inputs.image_name }}'"
            exit 1
          fi
          
          # Strip the leading './' to make it a clean filename string
          CLEAN_FILE_NAME=$(basename "$TARGET_FILE")
          echo "Found target repository file: $CLEAN_FILE_NAME"
          
          # 3. Fetch Runtime and Automated Cloudflare-Bypass Dependencies
          npm install @playwright/test playwright playwright-extra automation-extra-plugin-stealth
          npx playwright install --with-deps chromium
          
          # 4. Create the Automation Test File
          cat << 'EOF' > run_vheer.test.js
          const { test } = require('@playwright/test');
          const { chromium } = require('playwright-extra');
          const stealth = require('automation-extra-plugin-stealth')();

          chromium.use(stealth);

          test('Execute Image-to-Image Generation Loop', async () => {
            const browser = await chromium.launch({ headless: false });
            const context = await browser.newContext({
              viewport: { width: 1280, height: 720 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();

            console.log("Navigating to Vheer Workspace...");
            await page.goto('https://vheer.com', { waitUntil: 'networkidle' });
            await page.waitForTimeout(4000);

            // Inject the matching repository file found by the runner
            console.log(`Locating upload targets for: ${process.env.DETECTED_IMAGE_FILE}`);
            const fileInput = page.locator('input[type="file"]');
            if (await fileInput.count() > 0) {
              await fileInput.setInputFiles(process.env.DETECTED_IMAGE_FILE);
            } else {
              await page.setInputFiles('input[type="file"]', process.env.DETECTED_IMAGE_FILE);
            }
            await page.waitForTimeout(2000);

            // Populate AI transformation instructions
            console.log("Submitting prompt query parameters...");
            const promptBox = page.locator('textarea, input[placeholder*="Describe"], [role="textbox"]');
            await promptBox.first().click();
            await promptBox.first().fill(process.env.PROMPT_TEXT);
            await page.waitForTimeout(1000);

            // Configure event monitor to catch the generated asset response stream
            console.log("Arming network event listener matrix...");
            const generationResponsePromise = page.waitForResponse(response => {
              const contentType = response.headers()['content-type'] || '';
              return (
                response.status() === 200 && 
                (contentType.includes('image/') || response.url().includes('generate') || response.url().includes('status'))
              );
            }, { timeout: 180000 });

            // Click generate
            await page.locator('button:has-text("Generate")').first().click();
            
            console.log("Awaiting background processing layer to resolve graphics assets...");
            await generationResponsePromise;

            // Handle UI layer interaction and download
            const downloadButton = page.locator('button:has-text("Download"), [aria-label*="Download"]');
            await downloadButton.first().waitFor({ state: 'visible', timeout: 45000 });
            
            const downloadPromise = page.waitForEvent('download');
            await downloadButton.first().click();
            const download = await downloadPromise;

            // Save inside output directory for GitHub workspace processing
            await download.saveAs('./output/' + download.suggestedFilename());
            console.log("Image generation workflow successfully finished!");

            await context.close();
            await browser.close();
          });
          EOF

          # 5. Fire execution within a Spoofed Virtual Display Frame Buffer
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx playwright test run_vheer.test.js
        env:
          PROMPT_TEXT: ${{ inputs.prompt }}
          DETECTED_IMAGE_FILE: $CLEAN_FILE_NAME

      - name: Export Generated Output Graphic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vheer-generated-output
          path: output/
          retention-days: 3
