name: Vheer Repository Image Generation Engine
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'AI Target Modification Prompt'
        required: true
        type: string
      image_data:
        description: 'Base64 Encoded Image Data'
        required: true
        type: string

jobs:
  execute-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Tree
        uses: actions/checkout@v4

      - name: Setup Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Automation Dependencies
        run: |
          mkdir -p output
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Complete Vheer Pipeline
        run: |
          # 1. Dynamically locate 'input-image' regardless of extension (.jpg, .png, etc.)
          echo "Locating the repository base file..."
          TARGET_FILE=$(find . -maxdepth 1 -iname "input-image*" -print -quit)
          
          if [ -z "$TARGET_FILE" ] || [ ! -f "$TARGET_FILE" ]; then
            echo "::error:: Could not find any root file starting with 'input-image'"
            ls -la
            exit 1
          fi
          
          CLEAN_FILE_NAME=$(basename "$TARGET_FILE")
          echo "Discovered file target: $CLEAN_FILE_NAME"
          
          # 2. Trigger the Python file within a Spoofed Virtual Display Buffer
          export DETECTED_IMAGE_FILE="$CLEAN_FILE_NAME"
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" python generator.py
        env:
          PROMPT_TEXT: ${{ inputs.prompt }}
          VHEER_AUTH_STATE: ${{ secrets.VHEER_AUTH_STATE }}

      - name: Export Generated Output Graphic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vheer-generated-output
          path: output/
          retention-days: 3




