<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vheer AI Generator</title>
    <style>
        /* [Keep your existing CSS] */
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 15px; }
        button { padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; }
        img { max-width: 100%; border-radius: 10px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Vheer AI Generator</h1>
        <textarea id="promptInput" placeholder="Describe the change..." style="width: 100%; height: 80px;"></textarea>
        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
        <img id="previewImage" class="hidden">
        <br>
        <button id="generateBtn" onclick="createIssue()" disabled>🚀 Generate via Issue</button>
        <p id="status"></p>
    </div>

    <script>
        const REPO_OWNER = "My-Memory-2008";
        const REPO_NAME = "VHEER-IMAGE-TO-IMAGE-GENERATOR";
        let uploadedImageDataUrl = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImageDataUrl = e.target.result;
                document.getElementById("previewImage").src = uploadedImageDataUrl;
                document.getElementById("previewImage").classList.remove("hidden");
                document.getElementById("generateBtn").disabled = false;
            };
            reader.readAsDataURL(file);
        }

        async function createIssue() {
            const prompt = document.getElementById("promptInput").value.trim();
            const status = document.getElementById("status");
            
            status.textContent = "Creating request in GitHub...";
            
            // Format the issue body so the Action can read it
            const issueBody = `
VHEER_REQUEST
PROMPT: ${prompt}
IMAGE_DATA: ${uploadedImageDataUrl}
            `;

            try {
                // GitHub API allows creating issues on public repos without a token!
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/issues`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: `AI Request: ${prompt.substring(0, 30)}...`,
                        body: issueBody
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    status.innerHTML = `✅ Request sent! <a href="${data.html_url}" target="_blank" style="color: #10b981;">Track progress here</a>. The AI will reply to this issue when done.`;
                } else {
                    throw new Error("Failed to create issue");
                }
            } catch (error) {
                status.textContent = "❌ Error: " + error.message;
            }
        }
    </script>
</body>
</html>
