<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vheer AI Generator</title>
    <style>
        /* [Keep your existing CSS] */
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 15px; }
        button { padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        img { max-width: 100%; border-radius: 10px; margin-top: 15px; border: 1px solid #334155; }
        .hidden { display: none; }
        .progress-bar { height: 8px; background: #0f172a; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        .progress-fill { height: 100%; background: #10b981; width: 0%; transition: width 0.5s ease; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Vheer AI</h1>
        
        <!-- Input -->
        <div id="inputPanel">
            <textarea id="promptInput" placeholder="Describe the change..." style="width: 100%; height: 80px;"></textarea>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
            <img id="previewImage" class="hidden" style="max-height: 200px;">
            <button id="generateBtn" onclick="startGeneration()" disabled>🚀 Generate</button>
        </div>

        <!-- Processing -->
        <div id="processingPanel" class="hidden">
            <h2>AI is Working...</h2>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <p id="statusMessage">Waiting for workflow to complete...</p>
        </div>

        <!-- Result -->
        <div id="resultPanel" class="hidden">
            <h2 style="color: #10b981;">✓ Complete!</h2>
            <img id="resultImage" src="" alt="Generated Image">
            <button onclick="downloadResult()" style="background: #10b981;">📥 Download</button>
            <button onclick="resetUI()" style="background: #334155;">✎ New Image</button>
        </div>
    </div>

    <script>
        let uploadedImageDataUrl = null;
        let currentResultSrc = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImageDataUrl = e.target.result;
                document.getElementById("previewImage").src = uploadedImageDataUrl;
                document.getElementById("previewImage").classList.remove("hidden");
                document.getElementById("generateBtn").disabled = false;
            };
            reader.readAsDataURL(file);
        }

        async function compressImage(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ratio = Math.min(1024 / img.width, 1);
                    canvas.width = img.width * ratio;
                    canvas.height = img.height * ratio;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = dataUrl;
            });
        }

        async function startGeneration() {
            const prompt = document.getElementById("promptInput").value.trim();
            if (!uploadedImageDataUrl || !prompt) return;

            document.getElementById("inputPanel").classList.add("hidden");
            document.getElementById("processingPanel").classList.remove("hidden");
            
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 90) progress += 0.5;
                document.getElementById("progressFill").style.width = progress + "%";
            }, 1000);

            try {
                const compressedImage = await compressImage(uploadedImageDataUrl);
                
                const startRes = await fetch('/api/dispatch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, image_data: compressedImage })
                });

                const startData = await startRes.json();
                if (!startRes.ok) throw new Error(startData.error);
                
                const runId = startData.run_id;
                let attempts = 0;

                const poll = setInterval(async () => {
                    attempts++;
                    document.getElementById("statusMessage").textContent = `Checking status... (${attempts * 5}s)`;
                    
                    const statusRes = await fetch(`/api/status?run_id=${runId}`);
                    const statusData = await statusRes.json();

                    // ONLY show result when image_data is present
                    if (statusData.status === 'success' && statusData.image_data) {
                        clearInterval(poll);
                        clearInterval(progressInterval);
                        document.getElementById("progressFill").style.width = "100%";
                        
                        currentResultSrc = statusData.image_data;
                        
                        document.getElementById("processingPanel").classList.add("hidden");
                        document.getElementById("resultPanel").classList.remove("hidden");
                        document.getElementById("resultImage").src = currentResultSrc;
                        
                    } else if (statusData.conclusion === 'failure') {
                        clearInterval(poll);
                        alert("Workflow failed. Check GitHub logs.");
                        location.reload();
                    } else if (attempts >= 120) {
                        clearInterval(poll);
                        alert("Timeout.");
                        location.reload();
                    }
                }, 5000);

            } catch (error) {
                alert("Error: " + error.message);
                location.reload();
            }
        }

        function downloadResult() {
            if (currentResultSrc) {
                const a = document.createElement("a");
                a.href = currentResultSrc;
                a.download = `vheer_result_${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function resetUI() {
            document.getElementById("inputPanel").classList.remove("hidden");
            document.getElementById("processingPanel").classList.add("hidden");
            document.getElementById("resultPanel").classList.add("hidden");
            document.getElementById("promptInput").value = "";
            document.getElementById("fileInput").value = "";
            document.getElementById("previewImage").classList.add("hidden");
            document.getElementById("generateBtn").disabled = true;
            uploadedImageDataUrl = null;
        }
    </script>
</body>
</html>
