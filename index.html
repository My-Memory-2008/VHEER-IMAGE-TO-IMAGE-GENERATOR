<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vheer AI Image Generator</title>
    <!-- JSZip is required to extract the image from the GitHub Artifact ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* [Keep your existing CSS styles here] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #0f172a; --bg-secondary: #1e293b; --accent: #2563eb; --success: #10b981; --text: #f8fafc; --border: #334155; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .card { background: var(--bg-secondary); padding: 30px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; }
        .hidden { display: none !important; }
        button { padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        img { max-width: 100%; border-radius: 12px; margin-top: 15px; border: 1px solid var(--border); }
        .progress-bar { height: 8px; background: var(--bg); border-radius: 10px; overflow: hidden; margin-top: 20px; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.5s ease; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; margin-bottom: 30px;">✨ Vheer AI Generator</h1>

        <!-- Input Panel -->
        <div class="card" id="inputPanel">
            <textarea id="promptInput" placeholder="Describe the transformation..." style="width: 100%; height: 80px; margin-bottom: 15px; padding: 10px;"></textarea>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)" style="margin-bottom: 15px;">
            <img id="previewImage" class="hidden" style="max-height: 200px; object-fit: contain;">
            <br><br>
            <button id="generateBtn" onclick="startGeneration()" disabled>🚀 Generate Image</button>
        </div>

        <!-- Processing Panel -->
        <div class="card hidden" id="processingPanel">
            <h2>AI is working...</h2>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <p id="statusMessage" style="text-align: center; margin-top: 10px; color: #94a3b8;">Initializing...</p>
        </div>

        <!-- Result Panel -->
        <div class="card hidden" id="resultPanel">
            <h2 style="color: var(--success);">✓ Complete!</h2>
            <img id="resultImage" src="" alt="Generated Image">
            <br><br>
            <button onclick="downloadResult()" style="background: var(--success);">📥 Download Image</button>
            <button onclick="resetUI()" style="background: var(--bg-secondary); border: 1px solid var(--border); margin-top: 10px;">✎ Start Over</button>
        </div>
    </div>

    <script>
        let uploadedImageDataUrl = null;
        let currentResultSrc = null;

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImageDataUrl = e.target.result;
                document.getElementById("previewImage").src = uploadedImageDataUrl;
                document.getElementById("previewImage").classList.remove("hidden");
                document.getElementById("generateBtn").disabled = false;
            };
            reader.readAsDataURL(file);
        }

        async function compressImage(dataUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 1024;
                    const ratio = Math.min(maxWidth / img.width, 1);
                    canvas.width = img.width * ratio;
                    canvas.height = img.height * ratio;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = dataUrl;
            });
        }

        async function startGeneration() {
            const prompt = document.getElementById("promptInput").value.trim();
            if (!uploadedImageDataUrl || !prompt) return;

            document.getElementById("inputPanel").classList.add("hidden");
            document.getElementById("processingPanel").classList.remove("hidden");
            
            let progress = 0;
            const progressInterval = setInterval(() => {
                if (progress < 90) progress += 1;
                document.getElementById("progressFill").style.width = progress + "%";
            }, 1000);

            try {
                const compressedImage = await compressImage(uploadedImageDataUrl);
                
                const startRes = await fetch('/api/dispatch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, image_data: compressedImage })
                });

                const startData = await startRes.json();
                if (!startRes.ok) throw new Error(startData.error);

                const runId = startData.run_id;
                let attempts = 0;

                const poll = setInterval(async () => {
                    attempts++;
                    document.getElementById("statusMessage").textContent = `Checking status... (${attempts * 5}s)`;
                    
                    const statusRes = await fetch(`/api/status?run_id=${runId}`);
                    const statusData = await statusRes.json();

                    if (statusData.status === 'success' && statusData.download_url) {
                        clearInterval(poll);
                        clearInterval(progressInterval);
                        document.getElementById("progressFill").style.width = "100%";
                        document.getElementById("statusMessage").textContent = "Extracting image from artifact...";

                        // Fetch the ZIP and Extract Image
                        const zipResponse = await fetch(statusData.download_url);
                        const zipBlob = await zipResponse.blob();
                        const zip = await JSZip.loadAsync(zipBlob);
                        
                        // Find the first image file in the ZIP
                        let imageFile = null;
                        zip.forEach((relativePath, file) => {
                            if (!file.dir && (file.name.endsWith('.png') || file.name.endsWith('.jpg'))) {
                                imageFile = file;
                            }
                        });

                        if (imageFile) {
                            const base64Image = await imageFile.async("base64");
                            const mimeType = imageFile.name.endsWith('.png') ? 'image/png' : 'image/jpeg';
                            currentResultSrc = `data:${mimeType};base64,${base64Image}`;
                            
                            document.getElementById("processingPanel").classList.add("hidden");
                            document.getElementById("resultPanel").classList.remove("hidden");
                            document.getElementById("resultImage").src = currentResultSrc;
                        } else {
                            throw new Error("No image found inside the artifact ZIP.");
                        }

                    } else if (statusData.conclusion === 'failure') {
                        clearInterval(poll);
                        throw new Error("Workflow failed.");
                    } else if (attempts >= 120) { // 10 minute timeout
                        clearInterval(poll);
                        throw new Error("Timeout.");
                    }
                }, 5000);

            } catch (error) {
                alert("Error: " + error.message);
                location.reload();
            }
        }

        function downloadResult() {
            if (currentResultSrc) {
                const a = document.createElement("a");
                a.href = currentResultSrc;
                a.download = `vheer_result_${Date.now()}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function resetUI() {
            document.getElementById("inputPanel").classList.remove("hidden");
            document.getElementById("processingPanel").classList.add("hidden");
            document.getElementById("resultPanel").classList.add("hidden");
            document.getElementById("promptInput").value = "";
            document.getElementById("fileInput").value = "";
            document.getElementById("previewImage").classList.add("hidden");
            document.getElementById("generateBtn").disabled = true;
            uploadedImageDataUrl = null;
        }
    </script>
</body>
</html>
